# reload config
#bind=SUPER,r,spawn_shell,bash ~/.config/mango/scripts/config_check.sh
bind=SUPER,r,reload_config

# Core Apps & Terminal (i3 values copied)
bind=SUPER,Return,spawn,alacritty
bind=SUPER,q,killclient

# Rofi Menus (i3 values copied)
bind=CTRL+SHIFT,space,spawn,rofi -show combi -modi window,drun,combi -combi-modi window,run
bind=CTRL+SHIFT,p,spawn,~/.config/rofi/scripts/powermenu.sh

# Screenshots (i3 values copied)
bind=SUPER+SHIFT,s,spawn,flameshot gui
bind=SUPER,Print,spawn,flameshot full

# Window Navigation - Arrow Keys Focus (i3 values copied)
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# Window Movement - Move Focus (i3 values copied)
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# Layout & Orientation (i3 values mapped to Mango architecture)
bind=SUPER,h,setlayout,dwindle
bind=SUPER,s,setlayout,fair             
bind=SUPER,v,toggleoverview         
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER,space,togglejump             
bind=SUPER,a,togglemaximizescreen

# Workspace / Tag Switching 1-10 (i3 values copied)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0

# Move Container to Workspace 1-10 (i3 values copied)
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,10,0

# Lockscreen (i3 values copied)
bind=SUPER,l,spawn,sleep 0.1 && i3lock --blur 5

# System Audio / Media Controls (i3 pipeline values copied)
bind=NONE,XF86AudioRaiseVolume,spawn,pamixer -ui 3 && pamixer --get-volume > /tmp/xobpipe
bind=NONE,XF86AudioLowerVolume,spawn,pamixer -ud 3 && pamixer --get-volume > /tmp/xobpipe
bind=NONE,XF86AudioMute,spawn,amixer sset Master toggle | sed -En '/\[on\]/ s/.*\[([0-9]+)%\].*/\1/ p; /\[off\]/ s/.*/0/p' | head -1 > /tmp/xobpipe

# Window Management Tweaks & Sub-Layout Fallbacks
bind=SUPER,m,quit
bind=SUPER,Tab,focusstack,next
bind=SUPER,u,focuslast
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# Gaps Configurations
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# Mouse Integration
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=alt,btn_middle,set_proportion,0.5
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_left,minimized
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=SUPER+CTRL,btn_middle,togglefullscreen
mousebind=NONE,btn_middle,togglemaximizescreen,0
